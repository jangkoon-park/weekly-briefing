# 데일리 브리핑 설정 (8개 분야 · 34개 섹션, 매일 오전 8시 발송, 월요일엔 맨 위에 "이번 주 흐름").
#
# ■ 섹션(category) 하나의 형식
#   - key: ai_data              # 영문 식별자 (목차 링크에 사용)
#     name: "AI·데이터 도구"      # 메일에 표시되는 섹션명
#     group: tech               # 속한 분야 (아래 groups의 key) ← 이 값만 바꾸면 섹션이 다른 분야로 옮겨갑니다
#     type: rss                 # rss(기본) | hf_papers | hacker_news
#     max_items: 3              # (선택) 섹션 최대 개수 (생략하면 분야의 max_items)
#     hours_back: 48            # (선택) 최근 몇 시간 글까지 볼지 (생략하면 분야의 hours_back)
#     keywords: [금리, 환율]     # (선택) 제목에 이 중 하나라도 들어간 글만. 생략하면 필터 없음
#     exclude_keywords: [연예]   # (선택) 제목에 이 중 하나라도 들어가면 제외
#     rank: coverage            # (선택) 여러 매체가 함께 다룬 사건을 앞에 ("N개 매체 보도" 표시)
#     similarity: 0.5           # (선택) 같은 사건으로 볼 제목 유사도 (0~1, 기본 0.5)
#     feeds:
#       - name: "출처 이름"       # 메일에 출처로 표시
#         url: "RSS/Atom 주소"
#         max_items: 5          # (선택) 이 피드에서 가져올 최대 개수
#         keywords: [...]       # (선택) 이 피드에만 적용할 키워드 (분야 keywords 대신 사용)
#         exclude_keywords: [...] # (선택) 이 피드에만 적용할 제외 키워드
#         user_agent: "..."     # (선택) 기본 User-Agent를 막는 사이트용 (예: 한국경제)
#         region: kr | world    # (선택) 🇰🇷 국내 / 🌍 세계 표시. 생략하면 이름에 한글이 있으면 kr
#
# ■ 메일에는 groups 순서대로 분야가, 분야 안에서는 이 파일에 적힌 순서대로 섹션이 표시됩니다.
# ■ 섹션마다 국내 1개 + 해외 1개를 먼저 고르고 남은 자리를 채웁니다(한쪽만 있으면 있는 쪽에서).
# ■ 최근 history_days일 안에 보낸 글은 다시 싣지 않습니다(data/history).
# ■ 한 섹션 안에서는 여러 피드에서 번갈아 골라(한 피드가 독차지하지 않게) 최신순으로 보여줍니다.
#   rank: coverage인 섹션은 여러 매체가 다룬 사건 순으로 보여줍니다.
# ■ 같은 기사·같은 사건은 메일 한 통에서 한 번만 나옵니다(위쪽 섹션이 우선). 제목 유사도로 1차로 거르고,
#   번역·요약 옵션이 켜져 있으면 Claude가 표현·언어가 다른 중복을 한 번 더 거릅니다.
# ■ 새 글이 없는 섹션은 "새 소식 없음" 한 줄로 표시하고, 모든 섹션이 비면 메일을 보내지 않습니다.
# ■ 공식 RSS만 넣습니다(크롤링 없음). 죽은 피드는 경고 로그만 남기고 건너뜁니다.
#
# 키워드 매칭 규칙: 영문/숫자로만 된 키워드(SI, ERP, PostgreSQL 등)는 대소문자 무시 + 단어 경계 기준
# ("SI"가 "ASIA" 안에서 걸리지 않음), 한글이 섞인 키워드는 제목에 포함되어 있으면 통과.

settings:
  history_days: 35        # 발송 기록 보관 기간 (5주). 이 기간 안에 보낸 글은 다시 싣지 않고, 주간 흐름 재료로 씀
  default_hours_back: 36  # 분야·섹션에 hours_back이 없을 때 볼 기간 (시간)
  max_html_kb: 100        # 메일 HTML이 이 크기를 넘으면 분야별 개수를 자동으로 줄임 (지메일은 102KB부터 잘림)
  # 모든 RSS 분야에 공통으로 적용하는 제외 키워드 (광고성·보도자료성 표시가 붙은 글).
  # 번역·요약 옵션이 켜져 있으면 Claude가 광고·보도자료성 글을 한 번 더 거릅니다(ad).
  exclude_keywords: ["[광고]", "[AD]", "[PR]", "[협찬]", "[보도자료]", "[알림]", "[부고]", "[인사]", "[포토]", "[게시판]",
                     Sponsored, "Partner Content", "Paid Post", "Advertorial"]

# 분야: 메일 안 배치 순서 = 이 순서. max_items는 섹션당 최대 개수, hours_back은 기본으로 볼 기간(시간).
# 글이 드문 분야는 기간을 길게 잡되, 이미 보낸 글은 history로 걸러서 매일 반복되지 않게 한다.
groups:
  - {key: thought,    name: "사고·지성", max_items: 3, hours_back: 168}
  - {key: literature, name: "문학",      max_items: 3, hours_back: 336}
  - {key: art,        name: "미술",      max_items: 3, hours_back: 168}
  - {key: tech,       name: "AI·기술",   max_items: 3, hours_back: 48}
  - {key: work,       name: "일",        max_items: 2, hours_back: 168}
  - {key: world,      name: "세상",      max_items: 2, hours_back: 36}
  - {key: economy,    name: "경제·산업", max_items: 2, hours_back: 36}
  - {key: life,       name: "생활",      max_items: 2, hours_back: 72}

# 월요일 "이번 주 흐름"의 큰 방향 3줄이 묶는 분야
trend_areas:
  - {key: outer,   name: "바깥 세상", groups: [world, economy, life]}
  - {key: techwork, name: "기술과 일", groups: [tech, work]}
  - {key: mind,    name: "사유와 예술", groups: [thought, literature, art]}

x-exclude-entertainment: &exclude_entertainment
  [연예, 스포츠, 야구, 축구, 배구, 농구, 골프, 프로야구, KBO, MLB, K리그, EPL, NBA, 아이돌, 드라마, 예능, 컴백,
   열애, 결혼식, 걸그룹, 보이그룹, 가수, 배우, 시구, 감독 선임, 홈런, 결승골, 운세, 날씨, 오늘의]

categories:
  # ========================= 사고·지성 =========================

