name: Daily + Weekly Briefing

on:
  schedule:
    # 매일 한국시간(KST, UTC+9) 오전 8:00 = 전날 UTC 23:00
    # 한국시간 월요일(= UTC 일요일 23:00) 실행은 auto 모드에서 데일리+주간을 한 통으로 합쳐 보냅니다.
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "보낼 브리핑 종류"
        type: choice
        options: [daily, weekly, both]
        default: daily
      dry_run:
        description: "발송하지 않고 미리보기(아티팩트)만 만들기"
        type: boolean
        default: false
      translate_titles:
        description: "영어 제목을 한국어로 번역 (Claude Pro 구독 사용)"
        type: boolean
        default: false
      summarize_articles:
        description: "기사별 쉬운 말 한 줄 요약 (Claude Pro 구독 사용)"
        type: boolean
        default: false
      summarize_hn:
        description: "Hacker News 댓글 찬반 요약 (Claude Pro 구독 사용)"
        type: boolean
        default: false

env:
  # 스케줄 실행은 auto(한국시간 월요일이면 both, 그 외 daily), 수동 실행은 선택한 값
  MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'auto' }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
  # 수동 실행이면 입력값, 스케줄 실행이면 저장소 Variables의 TRANSLATE_TITLES / SUMMARIZE_ARTICLES / SUMMARIZE_HN (기본 false)
  TRANSLATE_TITLES: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.translate_titles) || vars.TRANSLATE_TITLES || 'false' }}
  SUMMARIZE_ARTICLES: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.summarize_articles) || vars.SUMMARIZE_ARTICLES || 'false' }}
  SUMMARIZE_HN: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.summarize_hn) || vars.SUMMARIZE_HN || 'false' }}

jobs:
  briefing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect (${{ env.MODE }})
        run: python -m src.collect --mode "$MODE"

      - name: Prepare translation / summaries (optional)
        id: enrich
        run: python -m src.enrich

      # 제목 번역·기사 요약·HN 댓글 요약을 Claude 한 번 호출로 처리 (Claude Pro 구독 사용, API 키 아님)
      - name: Translate + summarize with Claude (optional, one call)
        if: steps.enrich.outputs.needed == 'true'
        continue-on-error: true   # 실패해도 메일은 번역·요약 없이 그대로 발송
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model sonnet --max-turns 25 --allowedTools "Read,Write"'
          prompt: |
            data/enrich_prompt.md 파일을 Read로 읽고, 그 지시대로 data/enrich_input.json을 처리해서
            결과를 data/enrich.json에 저장하라. 다른 파일은 수정하지 마라.

      - name: Build + send email (Secrets 없으면 자동으로 dry-run)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m src.send --dry-run
          else
            python -m src.send
          fi

      - name: Upload preview HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-preview
          path: |
            data/briefing.json
            data/enrich*.json
            data/preview.html
          if-no-files-found: ignore
          retention-days: 14
