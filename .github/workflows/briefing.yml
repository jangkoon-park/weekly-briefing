name: Daily Briefing

on:
  schedule:
    # 매일 한국시간(KST, UTC+9) 오전 8:00 = 전날 UTC 23:00
    # 한국시간 월요일(= UTC 일요일 23:00) 실행은 메일 맨 위에 "이번 주 흐름"이 붙습니다.
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      weekly_trend:
        description: "이번 주 흐름 (auto = 한국시간 월요일에만)"
        type: choice
        options: [auto, "on", "off"]
        default: auto
      dry_run:
        description: "발송하지 않고 미리보기(아티팩트)만 만들기"
        type: boolean
        default: false
      translate_titles:
        description: "영어 제목을 한국어로 번역 (Claude Pro 구독 사용)"
        type: boolean
        default: false
      summarize_articles:
        description: "기사별 쉬운 말 한 줄 요약 (Claude Pro 구독 사용)"
        type: boolean
        default: false
      summarize_hn:
        description: "Hacker News 댓글 찬반 요약 (Claude Pro 구독 사용)"
        type: boolean
        default: false

# 발송 기록(data/history)·주간 흐름(data/trends)을 저장소에 커밋하므로 쓰기 권한 필요
permissions:
  contents: write
  id-token: write

env:
  # 이번 주 흐름: 스케줄 실행은 auto(한국시간 월요일), 수동 실행은 선택한 값.
  # 저장소 Variables에 WEEKLY_TREND=false를 넣으면 월요일에도 만들지 않습니다(기본 true).
  TREND: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.weekly_trend || 'auto' }}
  WEEKLY_TREND: ${{ vars.WEEKLY_TREND || 'true' }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
  # 수동 실행이면 입력값, 스케줄 실행이면 저장소 Variables의 TRANSLATE_TITLES / SUMMARIZE_ARTICLES / SUMMARIZE_HN (기본 false)
  TRANSLATE_TITLES: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.translate_titles) || vars.TRANSLATE_TITLES || 'false' }}
  SUMMARIZE_ARTICLES: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.summarize_articles) || vars.SUMMARIZE_ARTICLES || 'false' }}
  SUMMARIZE_HN: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.summarize_hn) || vars.SUMMARIZE_HN || 'false' }}

jobs:
  briefing:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 발송 기록(data/history)·주간 흐름(data/trends)을 저장소에 커밋
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect
        run: python -m src.collect --trend "$TREND"

      - name: Prepare translation / summaries / weekly trend (optional)
        id: enrich
        run: python -m src.enrich

      # 제목 번역·기사 요약·HN 댓글 요약·(월요일) 이번 주 흐름을 Claude 한 번 호출로 처리 (Claude Pro 구독 사용, API 키 아님)
      - name: Translate + summarize (+ weekly trend) with Claude (one call)
        if: steps.enrich.outputs.needed == 'true'
        continue-on-error: true   # 실패해도 메일은 번역·요약 없이 그대로 발송
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model sonnet --max-turns 40 --allowedTools "Read,Write"'
          prompt: |
            data/enrich_prompt.md 파일을 Read로 읽고 그 지시대로 작업하라.
            지시문에 적힌 결과 파일 외에는 만들거나 수정하지 마라.

      - name: Build + send email (Secrets 없으면 자동으로 dry-run)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m src.send --dry-run
          else
            python -m src.send
          fi

      # 발송 기록과 주간 흐름을 저장소에 남겨 다음 날(중복 방지)·다음 주(흐름 비교)로 이어지게 한다.
      # 매일 커밋이 생기므로 60일 무활동으로 예약 실행이 꺼지는 일도 없다.
      - name: Commit history
        if: env.DRY_RUN != 'true'
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 앞 단계의 Claude Code 액션이 git 인증 설정(extraheader·원격 URL 등)을 자기 토큰으로 바꿔 두고,
          # 그 토큰은 액션이 끝나면 무효가 된다. 인증 설정을 모두 지우고 이 워크플로의 GITHUB_TOKEN으로 다시 맞춘다.
          for scope in --local --global; do
            git config $scope --unset-all http.https://github.com/.extraheader || true
            for key in $(git config $scope --name-only --get-regexp '^url\..*\.insteadof$' 2>/dev/null); do
              git config $scope --unset-all "$key" || true
            done
          done
          git config --local --unset-all credential.helper || true
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/history data/trends 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "커밋할 기록 없음"
            exit 0
          fi
          git commit -m "briefing history $(TZ=Asia/Seoul date +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "기록 커밋 push 실패" && exit 1

      - name: Upload preview HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-preview
          path: |
            data/briefing.json
            data/enrich*.json
            data/trend*.json
            data/preview.html
          if-no-files-found: ignore
          retention-days: 14
